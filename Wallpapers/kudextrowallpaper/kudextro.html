<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Video with Live Subcount Overlay</title>
  <style>
    /* Reset */
    * {
      margin: 0; padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    /* Video styling */
    video {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
    }

    /* Iframe overlay styling */
    iframe {
      position: fixed;
      top: 5vh;   /* adjust vertical position */
      left: 5vh;  /* adjust horizontal position */
      width: 300px;
      height: 80px;
      border: none;
      z-index: 1;
      opacity: 0.75;  /* partial transparency */
      pointer-events: none; /* so clicks pass through */
    }
  </style>
</head>
<body>
  <!-- Your local video file -->
  <video autoplay muted loop playsinline>
    <source src="kudwprob3.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <!-- Livecounts subcount iframe -->
  <iframe src="https://livecounts.io/embed/youtube-live-subscriber-counter/UCKprwIi_BFZGhWeka4339xw" scrolling="no" allowtransparency="true"></iframe>
</body>
</html>
